<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivation - V10</title>
<style>
:root{--primary:#0066FF;--bg:#F8F9FA;--card:#FFFFFF;--text:#1A1A1A;--text-secondary:#6B7280;--border:#E5E7EB;--shadow:0 2px 8px rgba(0,0,0,0.08);--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:20px}
.header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding:16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.back-btn{width:40px;height:40px;background:var(--bg);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;text-decoration:none;color:var(--text)}
.back-btn:hover{background:var(--border)}
.header h1{font-size:24px;font-weight:700;flex:1}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.menu-card{background:linear-gradient(135deg,#10B981 0%,#059669 100%);border-radius:var(--radius);padding:32px;cursor:pointer;transition:all .3s;color:white}
.menu-card:hover{transform:translateY(-4px)}
.menu-icon{font-size:48px;margin-bottom:16px}
.menu-title{font-size:22px;font-weight:700;margin-bottom:8px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<a href="index.html" class="back-btn">←</a>
<h1>💪 Motivation</h1>
</div>
<div class="card">
<h2 style="margin-bottom:16px">Motivation-Modul</h2>
<p style="color:var(--text-secondary)">Gewohnheiten-Tracker kommt bald!</p>
</div>
<div class="menu-grid">
<div class="menu-card">
<div class="menu-icon">📊</div>
<div class="menu-title">Woche</div>
<div>In Entwicklung...</div>
</div>
<div class="menu-card">
<div class="menu-icon">📅</div>
<div class="menu-title">Monat</div>
<div>In Entwicklung...</div>
</div>
</div>
</div>
</body>
</html>
