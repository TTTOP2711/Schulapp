<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schule - V10</title>
    <style>
        :root {
            --primary: #0066FF; --primary-dark: #0052CC; --success: #00C853;
            --danger: #FF3B30; --warning: #FF9500; --bg: #F8F9FA; --card: #FFFFFF;
            --text: #1A1A1A; --text-secondary: #6B7280; --border: #E5E7EB;
            --shadow: 0 2px 8px rgba(0,0,0,0.08); --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .header { 
            display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
            padding: 16px; background: var(--card); border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg); border: none; border-radius: 10px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 18px; transition: all 0.2s; text-decoration: none; color: var(--text);
        }
        .back-btn:hover { background: var(--border); }
        .header h1 { font-size: 24px; font-weight: 700; flex: 1; }
        
        .tabs {
            display: flex; gap: 8px; background: var(--card); padding: 6px;
            border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px;
            overflow-x: auto;
        }
        .tab {
            padding: 10px 20px; background: transparent; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }
        .tab.active { background: var(--primary); color: white; }
        
        .content { display: none; }
        .content.active { display: block; }
        
        /* Subject Colors */
        .subject-sport { background: #FF9500; } .subject-deutsch { background: #FF3B30; }
        .subject-mathe { background: #007AFF; } .subject-mathe-spez { background: #0051A8; }
        .subject-physik { background: #FF2D92; } .subject-geo { background: #333333; color: white; }
        .subject-ethik { background: #FFD60A; } .subject-soz { background: #8E8E93; }
        .subject-latein { background: #636366; } .subject-wou { background: #F2F2F7; color: #333; }
        .subject-englisch { background: #AF52DE; } .subject-info { background: #1C1C1E; color: white; }
        .subject-geschichte { background: #2C2C2E; color: white; } .subject-bio { background: #34C759; }
        .subject-musik { background: #FFD60A; } .subject-kunst { background: #FFD60A; }
        .subject-chemie { background: #FF9500; } .subject-seminar { background: #8E8E93; }
        
        /* Fächer Accordion */
        .subject-accordion {
            background: var(--card); border-radius: var(--radius); margin-bottom: 12px;
            box-shadow: var(--shadow); overflow: hidden;
        }
        .subject-header {
            display: flex; align-items: center; gap: 12px; padding: 16px;
            cursor: pointer; transition: background 0.2s;
        }
        .subject-header:hover { background: var(--bg); }
        .subject-color {
            width: 40px; height: 40px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 600; color: white;
        }
        .subject-info { flex: 1; }
        .subject-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .subject-count { font-size: 13px; color: var(--text-secondary); }
        .subject-arrow {
            font-size: 18px; color: var(--text-secondary);
            transition: transform 0.2s;
        }
        .subject-header.open .subject-arrow { transform: rotate(90deg); }
        
        .subject-content {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
        }
        .subject-content.open { max-height: 2000px; }
        .subject-body { padding: 0 16px 16px; }
        
        /* Folder Structure */
        .folder-item {
            background: var(--bg); border-radius: 8px; margin-bottom: 8px;
            border-left: 3px solid var(--primary);
        }
        .folder-header {
            display: flex; align-items: center; gap: 10px; padding: 12px;
            cursor: pointer; transition: background 0.2s;
        }
        .folder-header:hover { background: #E5E7EB; }
        .folder-icon { font-size: 18px; }
        .folder-name { flex: 1; font-weight: 600; font-size: 14px; }
        .folder-arrow {
            font-size: 14px; color: var(--text-secondary);
            transition: transform 0.2s;
        }
        .folder-header.open .folder-arrow { transform: rotate(90deg); }
        
        .folder-units {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
        }
        .folder-units.open { max-height: 1000px; }
        
        .unit-item {
            padding: 10px 12px 10px 40px; border-top: 1px solid var(--border);
            display: flex; align-items: flex-start; gap: 10px;
        }
        .unit-info { flex: 1; }
        .unit-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .unit-desc { font-size: 12px; color: var(--text-secondary); }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 16px; background: var(--primary); color: white; border: none;
            border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--bg); color: var(--text); }
        .btn-secondary:hover { background: var(--border); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-small { padding: 6px 12px; font-size: 13px; }
        .btn-full { width: 100%; }
        
        .action-bar {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        
        /* Compact Cards */
        .card {
            background: var(--card); border-radius: var(--radius);
            padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px;
        }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        
        /* Timetable */
        .timetable-grid {
            display: grid; grid-template-columns: 80px repeat(5, 1fr); gap: 6px;
        }
        .time-cell, .day-header, .lesson-cell {
            padding: 10px 6px; border-radius: 6px; font-size: 12px; text-align: center;
        }
        .time-cell { background: var(--bg); font-weight: 600; }
        .day-header { background: var(--primary); color: white; font-weight: 600; }
        .lesson-cell {
            font-weight: 600; cursor: pointer; min-height: 45px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .lesson-cell:hover { transform: scale(1.05); opacity: 0.9; }
        .lesson-cell.empty { background: var(--bg); color: var(--text-secondary); }
        
        /* Homework/Tests */
        .item-list { display: grid; gap: 10px; }
        .item {
            background: var(--card); border-radius: var(--radius);
            padding: 12px; box-shadow: var(--shadow);
            display: flex; align-items: flex-start; gap: 10px;
        }
        .item-checkbox { width: 20px; height: 20px; cursor: pointer; margin-top: 2px; }
        .item-content { flex: 1; }
        .item-subject {
            font-weight: 600; font-size: 12px; display: inline-block;
            padding: 3px 8px; border-radius: 6px; color: white; margin-bottom: 4px;
        }
        .item-text { font-size: 14px; margin-bottom: 2px; }
        .item-meta { font-size: 12px; color: var(--text-secondary); }
        
        /* AI Response */
        .ai-response {
            background: linear-gradient(135deg, #667EEA, #764BA2);
            border-radius: var(--radius); padding: 16px; color: white; margin-top: 12px;
        }
        .ai-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .ai-content { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .ai-loading {
            display: flex; align-items: center; gap: 10px; padding: 16px;
            background: var(--bg); border-radius: var(--radius);
        }
        .ai-spinner {
            width: 16px; height: 16px; border: 2px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card); border-radius: var(--radius);
            max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        .modal-header {
            padding: 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 28px; height: 28px; border: none; background: var(--bg);
            border-radius: 6px; cursor: pointer; font-size: 16px;
        }
        .modal-body { padding: 16px; }
        .modal-footer {
            padding: 12px 16px; border-top: 1px solid var(--border);
            display: flex; gap: 8px; justify-content: flex-end;
        }
        
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border);
            border-radius: 8px; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        
        @media (max-width: 768px) {
            .timetable-grid { grid-template-columns: 60px repeat(5, 1fr); font-size: 11px; }
            .tabs { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <h1>📚 Schule</h1>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('faecher')">Fächer</button>
            <button class="tab" onclick="switchTab('stundenplan')">Stundenplan</button>
            <button class="tab" onclick="switchTab('hausaufgaben')">Hausaufgaben</button>
            <button class="tab" onclick="switchTab('tests')">Tests</button>
            <button class="tab" onclick="switchTab('ferien')">Ferien</button>
            <button class="tab" onclick="switchTab('ki')">KI</button>
        </div>
        
        <!-- FÄCHER TAB -->
        <div id="faecher" class="content active">
            <div class="action-bar">
                <button class="btn btn-secondary" onclick="collapseAll()">Alle zuklappen</button>
                <button class="btn btn-secondary" onclick="expandAll()">Alle aufklappen</button>
            </div>
            <div id="subjectsList"></div>
        </div>
        
        <!-- STUNDENPLAN TAB -->
        <div id="stundenplan" class="content">
            <div class="card">
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <button class="btn btn-small" id="weekA" onclick="switchWeek('a')">Woche A</button>
                    <button class="btn btn-small btn-secondary" id="weekB" onclick="switchWeek('b')">Woche B</button>
                </div>
                <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
                    Aktuelle Woche: <strong id="currentWeek">A</strong>
                </div>
            </div>
            <div id="timetableContent"></div>
        </div>
        
        <!-- HAUSAUFGABEN TAB -->
        <div id="hausaufgaben" class="content">
            <button class="btn btn-full" onclick="openModal('addHomeworkModal')">+ Hausaufgabe</button>
            <div class="item-list" id="homeworkList"></div>
        </div>
        
        <!-- TESTS TAB -->
        <div id="tests" class="content">
            <button class="btn btn-full" onclick="openModal('addTestModal')">+ Test/LK</button>
            <div class="item-list" id="testsList"></div>
        </div>
        
        <!-- FERIEN TAB -->
        <div id="ferien" class="content">
            <div class="card">
                <div class="card-title">Thüringer Schulferien 2026</div>
                <div id="thuringiaList"></div>
            </div>
            <div class="card">
                <div class="card-title">Meine Events</div>
                <button class="btn btn-small btn-secondary" onclick="openModal('addEventModal')">+ Event</button>
                <div id="eventsList"></div>
            </div>
        </div>
        
        <!-- KI TAB -->
        <div id="ki" class="content">
            <div class="card">
                <div class="card-title">KI-Assistent</div>
                <div style="display: grid; gap: 8px;">
                    <button class="btn btn-full" onclick="getMorningPrep()">☀️ Morgen-Vorbereitung</button>
                    <button class="btn btn-full btn-secondary" onclick="getTestPrep()">📝 Test-Vorbereitung</button>
                </div>
                <div id="aiResponse"></div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="addFolderModal" class="modal-overlay" onclick="if(event.target===this) closeModal('addFolderModal')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Neuer Ordner</div>
                <button class="modal-close" onclick="closeModal('addFolderModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Ordnername</label>
                    <input type="text" id="folderName" placeholder="z.B. Analysis">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addFolderModal')">Abbrechen</button>
                <button class="btn" onclick="saveFolder()">Erstellen</button>
            </div>
        </div>
    </div>

    <div id="addUnitModal" class="modal-overlay" onclick="if(event.target===this) closeModal('addUnitModal')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Neue Einheit</div>
                <button class="modal-close" onclick="closeModal('addUnitModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">In Ordner</label>
                    <select id="unitFolder">
                        <option value="">Kein Ordner (direkt im Fach)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Titel</label>
                    <input type="text" id="unitTitle" placeholder="z.B. Vektorrechnung">
                </div>
                <div class="form-group">
                    <label class="form-label">Beschreibung</label>
                    <textarea id="unitDesc" placeholder="Notizen..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addUnitModal')">Abbrechen</button>
                <button class="btn" onclick="saveUnit()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="addHomeworkModal" class="modal-overlay" onclick="if(event.target===this) closeModal('addHomeworkModal')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Neue Hausaufgabe</div>
                <button class="modal-close" onclick="closeModal('addHomeworkModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Fach</label>
                    <select id="hwSubject"></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Aufgabe</label>
                    <textarea id="hwDesc" placeholder="Was ist zu tun?"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Fällig am</label>
                    <input type="date" id="hwDue">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addHomeworkModal')">Abbrechen</button>
                <button class="btn" onclick="saveHomework()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="addTestModal" class="modal-overlay" onclick="if(event.target===this) closeModal('addTestModal')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Neuer Test/LK</div>
                <button class="modal-close" onclick="closeModal('addTestModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Fach</label>
                    <select id="testSubject"></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Thema</label>
                    <input type="text" id="testTopic" placeholder="z.B. Vektorrechnung">
                </div>
                <div class="form-group">
                    <label class="form-label">Datum</label>
                    <input type="date" id="testDate">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addTestModal')">Abbrechen</button>
                <button class="btn" onclick="saveTest()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="addEventModal" class="modal-overlay" onclick="if(event.target===this) closeModal('addEventModal')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Neues Event</div>
                <button class="modal-close" onclick="closeModal('addEventModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="eventName" placeholder="z.B. Wandertag">
                </div>
                <div class="form-group">
                    <label class="form-label">Von</label>
                    <input type="date" id="eventStart">
                </div>
                <div class="form-group">
                    <label class="form-label">Bis (optional)</label>
                    <input type="date" id="eventEnd">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addEventModal')">Abbrechen</button>
                <button class="btn" onclick="saveEvent()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="editLessonModal" class="modal-overlay" onclick="if(event.target===this) closeModal('editLessonModal')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Stunde bearbeiten</div>
                <button class="modal-close" onclick="closeModal('editLessonModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Fach</label>
                    <select id="lessonSubject"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="deleteLesson()">Löschen</button>
                <button class="btn btn-secondary" onclick="closeModal('editLessonModal')">Abbrechen</button>
                <button class="btn" onclick="saveLesson()">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        // DATA
        const SUBJECTS = [
            { id: 'sport', name: 'Sport', short: 'Sp', color: '#FF9500', class: 'subject-sport' },
            { id: 'deutsch', name: 'Deutsch', short: 'De', color: '#FF3B30', class: 'subject-deutsch' },
            { id: 'mathe', name: 'Mathe', short: 'Ma', color: '#007AFF', class: 'subject-mathe' },
            { id: 'mathe-spez', name: 'Mathe Spez', short: 'MS', color: '#0051A8', class: 'subject-mathe-spez' },
            { id: 'physik', name: 'Physik', short: 'Ph', color: '#FF2D92', class: 'subject-physik' },
            { id: 'geo', name: 'Geo', short: 'Ge', color: '#333333', class: 'subject-geo' },
            { id: 'ethik', name: 'Ethik', short: 'Et', color: '#FFD60A', class: 'subject-ethik' },
            { id: 'soz', name: 'Sozialkunde', short: 'Sk', color: '#8E8E93', class: 'subject-soz' },
            { id: 'latein', name: 'Latein', short: 'La', color: '#636366', class: 'subject-latein' },
            { id: 'wou', name: 'woU Info', short: 'wI', color: '#F2F2F7', class: 'subject-wou' },
            { id: 'englisch', name: 'Englisch', short: 'En', color: '#AF52DE', class: 'subject-englisch' },
            { id: 'info', name: 'Info', short: 'If', color: '#1C1C1E', class: 'subject-info' },
            { id: 'geschichte', name: 'Geschichte', short: 'Gs', color: '#2C2C2E', class: 'subject-geschichte' },
            { id: 'bio', name: 'Bio', short: 'Bi', color: '#34C759', class: 'subject-bio' },
            { id: 'musik', name: 'Musik', short: 'Mu', color: '#FFD60A', class: 'subject-musik' },
            { id: 'kunst', name: 'Kunst', short: 'Ku', color: '#FFD60A', class: 'subject-kunst' },
            { id: 'chemie', name: 'Chemie', short: 'Ch', color: '#FF9500', class: 'subject-chemie' },
            { id: 'seminar', name: 'Seminarfach', short: 'Se', color: '#8E8E93', class: 'subject-seminar' }
        ];

        const TIMES = [
            { id: 0, label: '0. Std', time: '07:00-07:45' },
            { id: 1, label: '1. Block', time: '07:50-09:20' },
            { id: 2, label: '2. Block', time: '09:45-11:15' },
            { id: 3, label: '3. Block', time: '11:40-13:10' },
            { id: 4, label: '4. Block', time: '13:30-15:00' },
            { id: 5, label: '5. Block', time: '15:05-16:35' }
        ];

        const VACATIONS = [
            { name: 'Winterferien', start: '2026-02-10', end: '2026-02-15' },
            { name: 'Osterferien', start: '2026-04-02', end: '2026-04-11' },
            { name: 'Pfingstferien', start: '2026-05-23', end: '2026-05-23' },
            { name: 'Sommerferien', start: '2026-07-20', end: '2026-08-30' },
            { name: 'Herbstferien', start: '2026-10-10', end: '2026-10-24' },
            { name: 'Weihnachtsferien', start: '2026-12-21', end: '2027-01-02' }
        ];

        let schoolData = JSON.parse(localStorage.getItem('schoolData') || JSON.stringify({
            subjects: SUBJECTS.map(s => ({ ...s, folders: [], units: [] })),
            timetable: {
                a: { mo: {}, di: {}, mi: {}, do: {}, fr: {} },
                b: { mo: {}, di: {}, mi: {}, do: {}, fr: {} }
            },
            currentWeek: 'a',
            weekStartDate: new Date().toISOString().split('T')[0],
            homework: [],
            tests: [],
            events: []
        }));

        let currentTab = 'faecher';
        let currentSubject = null;
        let currentWeek = 'a';
        let editingLesson = null;

        function saveData() {
            localStorage.setItem('schoolData', JSON.stringify(schoolData));
        }

        // TAB SWITCHING
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            
            if (tab === 'faecher') renderSubjects();
            else if (tab === 'stundenplan') renderTimetable();
            else if (tab === 'hausaufgaben') renderHomework();
            else if (tab === 'tests') renderTests();
            else if (tab === 'ferien') renderVacations();
        }

        // MODALS
        function openModal(id) {
            if (id === 'addUnitModal' && currentSubject) {
                const select = document.getElementById('unitFolder');
                select.innerHTML = '<option value="">Kein Ordner (direkt im Fach)</option>';
                currentSubject.folders.forEach(f => {
                    select.innerHTML += `<option value="${f.id}">${f.name}</option>`;
                });
            }
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // SUBJECTS
        function renderSubjects() {
            const list = document.getElementById('subjectsList');
            list.innerHTML = '';
            
            schoolData.subjects.forEach(subject => {
                const totalFolders = subject.folders.length;
                const totalUnits = subject.folders.reduce((sum, f) => sum + f.units.length, 0) + subject.units.length;
                
                const div = document.createElement('div');
                div.className = 'subject-accordion';
                div.innerHTML = `
                    <div class="subject-header" onclick="toggleSubject('${subject.id}')">
                        <div class="subject-color ${subject.class}">${subject.short}</div>
                        <div class="subject-info">
                            <div class="subject-name">${subject.name}</div>
                            <div class="subject-count">${totalFolders} Ordner · ${totalUnits} Einheiten</div>
                        </div>
                        <div class="subject-arrow">›</div>
                    </div>
                    <div class="subject-content" id="content-${subject.id}">
                        <div class="subject-body">
                            <div style="display: flex; gap: 6px; margin-bottom: 12px;">
                                <button class="btn btn-small" onclick="event.stopPropagation(); openAddFolder('${subject.id}')">+ Ordner</button>
                                <button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); openAddUnit('${subject.id}')">+ Einheit</button>
                            </div>
                            <div id="folders-${subject.id}"></div>
                            <div id="units-${subject.id}"></div>
                        </div>
                    </div>
                `;
                list.appendChild(div);
                
                renderFolders(subject);
                renderUnits(subject);
            });
        }

        function toggleSubject(id) {
            const header = event.currentTarget;
            const content = document.getElementById(`content-${id}`);
            header.classList.toggle('open');
            content.classList.toggle('open');
        }

        function collapseAll() {
            document.querySelectorAll('.subject-header, .folder-header').forEach(h => {
                h.classList.remove('open');
            });
            document.querySelectorAll('.subject-content, .folder-units').forEach(c => {
                c.classList.remove('open');
            });
        }

        function expandAll() {
            document.querySelectorAll('.subject-header').forEach(h => {
                h.classList.add('open');
            });
            document.querySelectorAll('.subject-content').forEach(c => {
                c.classList.add('open');
            });
        }

        function renderFolders(subject) {
            const container = document.getElementById(`folders-${subject.id}`);
            container.innerHTML = '';
            
            subject.folders.forEach(folder => {
                const div = document.createElement('div');
                div.className = 'folder-item';
                div.innerHTML = `
                    <div class="folder-header" onclick="toggleFolder('${subject.id}', '${folder.id}')">
                        <div class="folder-icon">📁</div>
                        <div class="folder-name">${folder.name}</div>
                        <div class="folder-arrow">›</div>
                    </div>
                    <div class="folder-units" id="folder-${folder.id}">
                        ${folder.units.map((unit, i) => `
                            <div class="unit-item">
                                <div class="unit-info">
                                    <div class="unit-title">${unit.title}</div>
                                    ${unit.description ? `<div class="unit-desc">${unit.description}</div>` : ''}
                                </div>
                                <button class="btn btn-small btn-danger" onclick="event.stopPropagation(); deleteUnit('${subject.id}', '${folder.id}', ${i})">×</button>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleFolder(subjectId, folderId) {
            const header = event.currentTarget;
            const content = document.getElementById(`folder-${folderId}`);
            header.classList.toggle('open');
            content.classList.toggle('open');
        }

        function renderUnits(subject) {
            const container = document.getElementById(`units-${subject.id}`);
            if (subject.units.length === 0) {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = '<div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);">' +
                subject.units.map((unit, i) => `
                    <div class="unit-item">
                        <div class="unit-info">
                            <div class="unit-title">${unit.title}</div>
                            ${unit.description ? `<div class="unit-desc">${unit.description}</div>` : ''}
                        </div>
                        <button class="btn btn-small btn-danger" onclick="deleteUnit('${subject.id}', null, ${i})">×</button>
                    </div>
                `).join('') + '</div>';
        }

        function openAddFolder(subjectId) {
            currentSubject = schoolData.subjects.find(s => s.id === subjectId);
            openModal('addFolderModal');
        }

        function openAddUnit(subjectId) {
            currentSubject = schoolData.subjects.find(s => s.id === subjectId);
            openModal('addUnitModal');
        }

        function saveFolder() {
            const name = document.getElementById('folderName').value.trim();
            if (!name) { alert('Name eingeben!'); return; }
            
            currentSubject.folders.push({
                id: 'folder_' + Date.now(),
                name: name,
                units: []
            });
            saveData();
            renderSubjects();
            closeModal('addFolderModal');
            document.getElementById('folderName').value = '';
        }

        function saveUnit() {
            const folderId = document.getElementById('unitFolder').value;
            const title = document.getElementById('unitTitle').value.trim();
            const description = document.getElementById('unitDesc').value.trim();
            
            if (!title) { alert('Titel eingeben!'); return; }
            
            const unit = { title, description };
            
            if (folderId) {
                const folder = currentSubject.folders.find(f => f.id === folderId);
                folder.units.push(unit);
            } else {
                currentSubject.units.push(unit);
            }
            
            saveData();
            renderSubjects();
            closeModal('addUnitModal');
            document.getElementById('unitTitle').value = '';
            document.getElementById('unitDesc').value = '';
        }

        function deleteUnit(subjectId, folderId, index) {
            if (!confirm('Wirklich löschen?')) return;
            
            const subject = schoolData.subjects.find(s => s.id === subjectId);
            if (folderId) {
                const folder = subject.folders.find(f => f.id === folderId);
                folder.units.splice(index, 1);
            } else {
                subject.units.splice(index, 1);
            }
            
            saveData();
            renderSubjects();
        }

        // TIMETABLE
        function renderTimetable() {
            const start = new Date(schoolData.weekStartDate);
            const now = new Date();
            const weeks = Math.floor((now - start) / (7 * 24 * 60 * 60 * 1000));
            schoolData.currentWeek = weeks % 2 === 0 ? 'a' : 'b';
            currentWeek = schoolData.currentWeek;
            
            document.getElementById('currentWeek').textContent = currentWeek.toUpperCase();
            document.getElementById('weekA').className = currentWeek === 'a' ? 'btn btn-small' : 'btn btn-small btn-secondary';
            document.getElementById('weekB').className = currentWeek === 'b' ? 'btn btn-small' : 'btn btn-small btn-secondary';
            
            renderTimetableGrid();
        }

        function switchWeek(week) {
            currentWeek = week;
            document.getElementById('weekA').className = week === 'a' ? 'btn btn-small' : 'btn btn-small btn-secondary';
            document.getElementById('weekB').className = week === 'b' ? 'btn btn-small' : 'btn btn-small btn-secondary';
            renderTimetableGrid();
        }

        function renderTimetableGrid() {
            const schedule = schoolData.timetable[currentWeek];
            let html = '<div class="timetable-grid"><div class="time-cell"></div>';
            
            ['Mo', 'Di', 'Mi', 'Do', 'Fr'].forEach(d => {
                html += `<div class="day-header">${d}</div>`;
            });
            
            TIMES.forEach(time => {
                html += `<div class="time-cell">${time.label}<br><small>${time.time}</small></div>`;
                
                ['mo', 'di', 'mi', 'do', 'fr'].forEach(day => {
                    const lessonId = schedule[day][time.id];
                    if (lessonId) {
                        const subject = SUBJECTS.find(s => s.id === lessonId);
                        html += `<div class="lesson-cell ${subject.class}" onclick="editLesson('${currentWeek}', '${day}', ${time.id})">${subject.short}</div>`;
                    } else {
                        html += `<div class="lesson-cell empty" onclick="editLesson('${currentWeek}', '${day}', ${time.id})">+</div>`;
                    }
                });
            });
            
            html += '</div>';
            document.getElementById('timetableContent').innerHTML = html;
        }

        function editLesson(week, day, block) {
            editingLesson = { week, day, block };
            const select = document.getElementById('lessonSubject');
            select.innerHTML = '<option value="">Kein Fach</option>';
            SUBJECTS.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
            const current = schoolData.timetable[week][day][block];
            if (current) select.value = current;
            openModal('editLessonModal');
        }

        function saveLesson() {
            const id = document.getElementById('lessonSubject').value;
            if (id) {
                schoolData.timetable[editingLesson.week][editingLesson.day][editingLesson.block] = id;
            } else {
                delete schoolData.timetable[editingLesson.week][editingLesson.day][editingLesson.block];
            }
            saveData();
            renderTimetableGrid();
            closeModal('editLessonModal');
        }

        function deleteLesson() {
            delete schoolData.timetable[editingLesson.week][editingLesson.day][editingLesson.block];
            saveData();
            renderTimetableGrid();
            closeModal('editLessonModal');
        }

        // HOMEWORK
        function renderHomework() {
            const list = document.getElementById('homeworkList');
            const hw = schoolData.homework.filter(h => !h.done).sort((a, b) => new Date(a.due) - new Date(b.due));
            
            if (hw.length === 0) {
                list.innerHTML = '<div class="card" style="text-align:center; padding:30px;"><p style="color:var(--text-secondary);">Keine offenen Hausaufgaben 🎉</p></div>';
                return;
            }
            
            list.innerHTML = '';
            hw.forEach((item, i) => {
                const subject = SUBJECTS.find(s => s.id === item.subject);
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <input type="checkbox" class="item-checkbox" onchange="toggleHomework(${schoolData.homework.indexOf(item)})">
                    <div class="item-content">
                        <span class="item-subject ${subject.class}">${subject.name}</span>
                        <div class="item-text">${item.description}</div>
                        <div class="item-meta">Fällig: ${new Date(item.due).toLocaleDateString('de-DE')}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function toggleHomework(i) {
            schoolData.homework[i].done = !schoolData.homework[i].done;
            saveData();
            renderHomework();
        }

        function saveHomework() {
            const subject = document.getElementById('hwSubject').value;
            const description = document.getElementById('hwDesc').value.trim();
            const due = document.getElementById('hwDue').value;
            
            if (!description || !due) { alert('Alle Felder ausfüllen!'); return; }
            
            schoolData.homework.push({ subject, description, due, done: false });
            saveData();
            renderHomework();
            closeModal('addHomeworkModal');
            document.getElementById('hwDesc').value = '';
            document.getElementById('hwDue').value = '';
        }

        // TESTS
        function renderTests() {
            const list = document.getElementById('testsList');
            const tests = schoolData.tests.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            if (tests.length === 0) {
                list.innerHTML = '<div class="card" style="text-align:center; padding:30px;"><p style="color:var(--text-secondary);">Keine Tests eingetragen</p></div>';
                return;
            }
            
            list.innerHTML = '';
            tests.forEach(item => {
                const subject = SUBJECTS.find(s => s.id === item.subject);
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div class="item-content">
                        <span class="item-subject ${subject.class}">${subject.name}</span>
                        <div class="item-text">${item.topic}</div>
                        <div class="item-meta">${new Date(item.date).toLocaleDateString('de-DE')}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function saveTest() {
            const subject = document.getElementById('testSubject').value;
            const topic = document.getElementById('testTopic').value.trim();
            const date = document.getElementById('testDate').value;
            
            if (!topic || !date) { alert('Alle Felder ausfüllen!'); return; }
            
            schoolData.tests.push({ subject, topic, date });
            saveData();
            renderTests();
            closeModal('addTestModal');
            document.getElementById('testTopic').value = '';
            document.getElementById('testDate').value = '';
        }

        // VACATIONS
        function renderVacations() {
            const thuList = document.getElementById('thuringiaList');
            thuList.innerHTML = VACATIONS.map(v => {
                const start = new Date(v.start).toLocaleDateString('de-DE');
                const end = new Date(v.end).toLocaleDateString('de-DE');
                return `<div style="padding: 8px 0; border-bottom: 1px solid var(--border);">
                    <strong>${v.name}</strong><br>
                    <small style="color: var(--text-secondary);">${start} - ${end}</small>
                </div>`;
            }).join('');
            
            const eventsList = document.getElementById('eventsList');
            if (schoolData.events.length === 0) {
                eventsList.innerHTML = '<p style="color: var(--text-secondary); padding: 10px 0;">Keine Events</p>';
                return;
            }
            
            eventsList.innerHTML = schoolData.events.map((e, i) => {
                const start = new Date(e.start).toLocaleDateString('de-DE');
                const end = e.end ? new Date(e.end).toLocaleDateString('de-DE') : start;
                return `<div style="padding: 8px 0; display: flex; justify-content: space-between;">
                    <div>
                        <strong>${e.name}</strong><br>
                        <small style="color: var(--text-secondary);">${start}${e.end ? ' - ' + end : ''}</small>
                    </div>
                    <button class="btn btn-small btn-danger" onclick="deleteEvent(${i})">×</button>
                </div>`;
            }).join('');
        }

        function saveEvent() {
            const name = document.getElementById('eventName').value.trim();
            const start = document.getElementById('eventStart').value;
            const end = document.getElementById('eventEnd').value;
            
            if (!name || !start) { alert('Name und Start eingeben!'); return; }
            
            schoolData.events.push({ name, start, end: end || null });
            saveData();
            renderVacations();
            closeModal('addEventModal');
            document.getElementById('eventName').value = '';
            document.getElementById('eventStart').value = '';
            document.getElementById('eventEnd').value = '';
        }

        function deleteEvent(i) {
            if (confirm('Wirklich löschen?')) {
                schoolData.events.splice(i, 1);
                saveData();
                renderVacations();
            }
        }

        // AI
        async function callClaudeAPI(systemPrompt, userPrompt) {
            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 800,
                        messages: [{ role: "user", content: userPrompt }],
                        system: systemPrompt
                    })
                });
                const data = await response.json();
                return data.content.map(item => item.text || "").join("\n");
            } catch (error) {
                return "Fehler bei der KI-Anfrage.";
            }
        }

        async function getMorningPrep() {
            const container = document.getElementById('aiResponse');
            container.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div><div>KI analysiert...</div></div>';
            
            const today = new Date();
            const dayNames = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
            const dayKey = ['mo', 'di', 'mi', 'do', 'fr'][today.getDay() - 1];
            const schedule = dayKey ? schoolData.timetable[schoolData.currentWeek][dayKey] : {};
            
            let scheduleText = '';
            TIMES.forEach(time => {
                const lessonId = schedule[time.id];
                if (lessonId) {
                    const subject = SUBJECTS.find(s => s.id === lessonId);
                    scheduleText += `${time.label}: ${subject?.name || 'Unbekannt'}\n`;
                }
            });
            
            const response = await callClaudeAPI(
                "Du bist ein Schul-Assistent. Gib kurze, motivierende Tipps.",
                `Heute ist ${dayNames[today.getDay()]}. Stundenplan:\n${scheduleText || 'Kein Unterricht'}\n\nGib 3-4 Sätze Vorbereitung: Was mitbringen, worauf achten?`
            );
            
            container.innerHTML = `<div class="ai-response"><div class="ai-title">☀️ Morgen-Vorbereitung</div><div class="ai-content">${response}</div></div>`;
        }

        async function getTestPrep() {
            const container = document.getElementById('aiResponse');
            container.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div><div>KI prüft Tests...</div></div>';
            
            const today = new Date();
            const upcoming = schoolData.tests.filter(test => {
                const testDate = new Date(test.date);
                const diffDays = Math.floor((testDate - today) / (1000 * 60 * 60 * 24));
                return diffDays >= 0 && diffDays <= 7;
            });
            
            if (upcoming.length === 0) {
                container.innerHTML = `<div class="ai-response"><div class="ai-title">📝 Test-Vorbereitung</div><div class="ai-content">Super! Keine Tests in den nächsten 7 Tagen. 😊</div></div>`;
                return;
            }
            
            let testsText = '';
            upcoming.forEach(test => {
                const subject = SUBJECTS.find(s => s.id === test.subject);
                const testDate = new Date(test.date);
                const diffDays = Math.floor((testDate - today) / (1000 * 60 * 60 * 24));
                testsText += `- ${subject?.name}: ${test.topic} (in ${diffDays} Tagen)\n`;
            });
            
            const response = await callClaudeAPI(
                "Du bist ein Lern-Coach. Gib konkrete, motivierende Tipps.",
                `Tests:\n${testsText}\n\nGib einen kurzen (4-5 Sätze) Lernplan!`
            );
            
            container.innerHTML = `<div class="ai-response"><div class="ai-title">📝 Test-Vorbereitung</div><div class="ai-content">${response}</div></div>`;
        }

        // INIT
        window.addEventListener('DOMContentLoaded', () => {
            const hwSelect = document.getElementById('hwSubject');
            const testSelect = document.getElementById('testSubject');
            [hwSelect, testSelect].forEach(select => {
                if (select) {
                    select.innerHTML = '';
                    SUBJECTS.forEach(s => select.innerHTML += `<option value="${s.id}">${s.name}</option>`);
                }
            });
            
            renderSubjects();
            console.log('📚 V10 Schule geladen!');
        });
    </script>
</body>
</html>
