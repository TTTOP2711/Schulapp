<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Vokabeltrainer Unit 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .unit-selector {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .unit-selector h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f5f5f7;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-item:active {
            background: #e8e8ed;
        }

        .checkbox-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            cursor: pointer;
        }

        .checkbox-item label {
            flex: 1;
            cursor: pointer;
            font-size: 16px;
        }

        .count {
            font-size: 14px;
            color: #86868b;
        }

        .slider-group {
            margin-top: 20px;
        }

        .slider-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .slider-value {
            display: inline-block;
            margin-left: 8px;
            color: #0071e3;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #d1d1d6;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #0071e3;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #0071e3;
            cursor: pointer;
            border: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }

        .btn:active {
            background: #0077ed;
        }

        .btn:disabled {
            background: #d1d1d6;
            cursor: not-allowed;
        }

        .quiz-card {
            background: white;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .progress {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 20px;
        }

        .question {
            font-size: 24px;
            font-weight: 600;
            margin: 30px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .direction {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border: 2px solid #d1d1d6;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #0071e3;
        }

        .feedback {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
        }

        .correct-answer {
            margin-top: 8px;
            font-size: 14px;
            color: #424245;
        }

        .results-card {
            background: white;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .score {
            font-size: 48px;
            font-weight: 700;
            color: #0071e3;
            margin: 20px 0;
        }

        .score-label {
            font-size: 16px;
            color: #86868b;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .stat-item {
            background: #f5f5f7;
            padding: 20px;
            border-radius: 12px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .stat-label {
            font-size: 14px;
            color: #86868b;
            margin-top: 5px;
        }

        .btn-secondary {
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .btn-secondary:active {
            background: #e8e8ed;
        }

        @media (max-width: 390px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .question {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>Vokabeltrainer</h1>
            
            <div class="unit-selector">
                <h2>Wähle Units aus:</h2>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="unitA" checked>
                        <label for="unitA">Unit 2 Part A</label>
                        <span class="count" id="countA">0</span>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="unitB" checked>
                        <label for="unitB">Unit 2 Part B</label>
                        <span class="count" id="countB">0</span>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="unitC" checked>
                        <label for="unitC">Unit 2 Part C</label>
                        <span class="count" id="countC">0</span>
                    </div>
                </div>

                <div class="slider-group">
                    <label>
                        Anzahl Vokabeln: 
                        <span class="slider-value" id="sliderValue">15</span>
                    </label>
                    <input type="range" id="vocabCount" min="10" max="20" value="15">
                </div>
            </div>

            <button class="btn" id="startBtn">Lernen starten</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-card">
                <div class="progress">
                    Frage <span id="currentQ">1</span> von <span id="totalQ">15</span>
                </div>
                
                <div class="direction" id="direction">Übersetze ins Deutsche</div>
                
                <div class="question" id="question">Loading...</div>
                
                <input type="text" id="answer" placeholder="Deine Antwort..." autocomplete="off" autocapitalize="off">
                
                <div id="feedback"></div>
                
                <button class="btn" id="submitBtn">Prüfen</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <h1>Auswertung</h1>
            
            <div class="results-card">
                <div class="score" id="score">0</div>
                <div class="score-label">Punkte erreicht</div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="correctCount">0</div>
                        <div class="stat-label">Richtig</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="incorrectCount">0</div>
                        <div class="stat-label">Falsch</div>
                    </div>
                </div>
                
                <button class="btn" id="newRoundBtn">Neue Runde</button>
                <button class="btn btn-secondary" id="backBtn">Zurück zur Auswahl</button>
            </div>
        </div>
    </div>

                {en: ["distance"], de: ["distanz", "entfernung"], hint: "(to) travel long distances / weite Strecken fahren/zurücklegen"},
                {en: ["transport"], de: ["verkehrsmittel", "transport"], hint: "different forms of transport"},
                {en: ["(to) face sth."], de: ["vor etwas stehen", "mit etwas konfrontiert werden"], hint: "Jamie, face the facts. You'll never be a rock star. As a single parent, you have to face problems other parents don't have to deal with."},
                {en: ["(to) fit in"], de: ["sich einfügen", "seinen platz finden", "hineinpassen"], hint: "At first, I found it difficult to fit in at my new school. There are some students in my sister's class who just don't fit in."},
                {en: ["(to) act"], de: ["handeln", "sich verhalten"], hint: "When you get older you're expected to act more responsibly."},
                {en: ["(to) adapt (to sth.)"], de: ["sich (einer sache) anpassen"], hint: "When they moved to India, it took some time to adapt to the climate."},
                {en: ["(to) get used to sth."], de: ["sich an etwas gewöhnen"], hint: "When we were in England, it was strange to drive on the left, but we soon got used to it. Did you know that people once used to drive on the left in Sweden? / After a couple of days we got used to driving on the left. / Nicht verwechseln: Did you know that people once used to drive on the left in Sweden? / After a couple of days we got used to driving on the left."},
                {en: ["(to) end up doing sth."], de: ["schließlich etwas tun"], hint: "My aunt started her career washing the dishes in a hotel. She ended up owning the place."},
                {en: ["responsibility"], de: ["verantwortung"], hint: "Having children is a big responsibility."},
                {en: ["within"], de: ["innerhalb (von)"], hint: "Do you think you can finish your project within a week? We respect all cultures within our community."},
                {en: ["advisor"], de: ["berater", "beraterin"], hint: "1. advice (Rat); 2. advisor, -ser (Berater/in)"},
                {en: ["carer"], de: ["betreuer", "betreuerin"], hint: "The old man couldn't look after himself any longer and needed a carer."},
                {en: ["(to) be dependent on sb./sth."], de: ["von jm./etwas abhängig sein", "auf jn./etwas angewiesen sein"], hint: "Children are dependent on their parents until they start to earn money."},
                {en: ["(to) get to do sth."], de: ["etwas tun können/dürfen", "die möglichkeit haben etwas zu tun"], hint: "I only get to go to the party tonight if I finish all my homework."},
                {en: ["not ... anywhere"], de: ["nirgendwo", "nirgendwohin"], hint: "Where's my key? I can't see it anywhere. I don't want to go anywhere. I just want to stay at home."},
                {en: ["shop window"], de: ["schaufenster"], hint: ""},
                {en: ["apron"], de: ["schürze"], hint: ""},
                {en: ["(to) be in a hurry"], de: ["in eile sein", "es eilig haben"], hint: "Come for dinner tomorrow. We'll eat around seven. I tried to act calmly, but it was difficult to hide how nervous I was."},
                {en: ["normally"], de: ["normalerweise", "normal"], hint: "adj: normal - adv: normally"}
            ]
        };

        // App State
        let currentQuiz = [];
        let currentIndex = 0;
        let score = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let currentQuestion = null;
        let hasAnswered = false;
        let currentAttempt = 1; // Track attempt number (1 or 2)
        let wrongAnswers = []; // Track wrong answers for spaced repetition

        // Elements
        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        
        const unitA = document.getElementById('unitA');
        const unitB = document.getElementById('unitB');
        const unitC = document.getElementById('unitC');
        const vocabCountSlider = document.getElementById('vocabCount');
        const sliderValue = document.getElementById('sliderValue');
        const startBtn = document.getElementById('startBtn');
        
        const currentQ = document.getElementById('currentQ');
        const totalQ = document.getElementById('totalQ');
        const direction = document.getElementById('direction');
        const question = document.getElementById('question');
        const answerInput = document.getElementById('answer');
        const feedback = document.getElementById('feedback');
        const submitBtn = document.getElementById('submitBtn');
        
        const scoreDisplay = document.getElementById('score');
        const correctCount = document.getElementById('correctCount');
        const incorrectCount = document.getElementById('incorrectCount');
        const newRoundBtn = document.getElementById('newRoundBtn');
        const backBtn = document.getElementById('backBtn');

        // Update counts
        function updateCounts() {
            document.getElementById('countA').textContent = vocabulary.A.length + ' Vokabeln';
            document.getElementById('countB').textContent = vocabulary.B.length + ' Vokabeln';
            document.getElementById('countC').textContent = vocabulary.C.length + ' Vokabeln';
        }

        // Slider update
        vocabCountSlider.addEventListener('input', (e) => {
            sliderValue.textContent = e.target.value;
        });

        // Start quiz
        startBtn.addEventListener('click', () => {
            const selectedUnits = [];
            if (unitA.checked) selectedUnits.push(...vocabulary.A);
            if (unitB.checked) selectedUnits.push(...vocabulary.B);
            if (unitC.checked) selectedUnits.push(...vocabulary.C);

            if (selectedUnits.length === 0) {
                alert('Bitte wähle mindestens eine Unit aus!');
                return;
            }

            const count = parseInt(vocabCountSlider.value);
            
            // Include wrong answers with higher frequency (3x more likely)
            let pool = [...selectedUnits];
            wrongAnswers.forEach(wrongVocab => {
                pool.push(wrongVocab, wrongVocab, wrongVocab); // Add 3 times
            });
            
            currentQuiz = shuffleArray(pool).slice(0, Math.min(count, pool.length));
            
            currentIndex = 0;
            score = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            
            totalQ.textContent = currentQuiz.length;
            
            showScreen('quizScreen');
            loadQuestion();
        });

        // Load question
        function loadQuestion() {
            if (currentIndex >= currentQuiz.length) {
                showResults();
                return;
            }

            hasAnswered = false;
            currentAttempt = 1; // Reset to first attempt
            currentQuestion = currentQuiz[currentIndex];
            
            // Random direction
            const isEnglishToGerman = Math.random() < 0.5;
            
            if (isEnglishToGerman) {
                direction.textContent = 'Übersetze ins Deutsche';
                // Pick random English variant to display
                const enVariant = currentQuestion.en[Math.floor(Math.random() * currentQuestion.en.length)];
                question.textContent = enVariant;
                currentQuestion.correctAnswers = currentQuestion.de;
                currentQuestion.direction = 'de';
                currentQuestion.questionText = enVariant;
            } else {
                direction.textContent = 'Übersetze ins Englische';
                // Pick random German variant to display
                const deVariant = currentQuestion.de[Math.floor(Math.random() * currentQuestion.de.length)];
                question.textContent = deVariant;
                currentQuestion.correctAnswers = currentQuestion.en;
                currentQuestion.direction = 'en';
                currentQuestion.questionText = deVariant;
            }

            currentQ.textContent = currentIndex + 1;
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.focus();
            feedback.innerHTML = '';
            submitBtn.textContent = 'Prüfen';
        }

        // Submit answer
        submitBtn.addEventListener('click', () => {
            if (!hasAnswered) {
                checkAnswer();
            } else {
                currentIndex++;
                loadQuestion();
            }
        });

        // Enter key support
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });

        // Check answer
        function checkAnswer() {
            const userAnswer = answerInput.value.trim().toLowerCase();
            
            if (userAnswer === '') {
                alert('Bitte gib eine Antwort ein!');
                return;
            }
            
            // Normalize answer (remove special chars, extra spaces)
            const normalizeAnswer = (str) => str
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
            
            const normalizedUser = normalizeAnswer(userAnswer);
            
            // Check against all accepted answers
            const isCorrect = currentQuestion.correctAnswers.some(answer => {
                const normalizedCorrect = normalizeAnswer(answer);
                return normalizedUser === normalizedCorrect;
            });
            
            if (isCorrect) {
                // Correct answer
                hasAnswered = true;
                answerInput.disabled = true;
                score++;
                correctAnswers++;
                feedback.className = 'feedback correct';
                feedback.innerHTML = '✓ Richtig!';
                submitBtn.textContent = 'Weiter';
            } else {
                // Wrong answer
                if (currentAttempt === 1) {
                    // First attempt - show hint if available
                    currentAttempt = 2;
                    feedback.className = 'feedback incorrect';
                    
                    let feedbackHtml = '✗ Falsch - Versuch es noch einmal!';
                    if (currentQuestion.hint && currentQuestion.hint.trim() !== '') {
                        feedbackHtml += `<div class="correct-answer" style="margin-top: 12px;"><strong>Hinweis:</strong> ${currentQuestion.hint}</div>`;
                    }
                    
                    feedback.innerHTML = feedbackHtml;
                    answerInput.value = '';
                    answerInput.focus();
                } else {
                    // Second attempt - show correct answer
                    hasAnswered = true;
                    answerInput.disabled = true;
                    incorrectAnswers++;
                    
                    // Add to wrong answers for spaced repetition
                    if (!wrongAnswers.some(v => v === currentQuestion)) {
                        wrongAnswers.push(currentQuestion);
                    }
                    
                    feedback.className = 'feedback incorrect';
                    const correctAnswersText = currentQuestion.correctAnswers.join(' / ');
                    feedback.innerHTML = `✗ Leider falsch<div class="correct-answer">Richtige Antwort: ${correctAnswersText}</div>`;
                    submitBtn.textContent = 'Weiter';
                }
            }
        }

        // Show results
        function showResults() {
            scoreDisplay.textContent = score;
            correctCount.textContent = correctAnswers;
            incorrectCount.textContent = incorrectAnswers;
            showScreen('resultsScreen');
        }

        // New round
        newRoundBtn.addEventListener('click', () => {
            startBtn.click();
        });

        // Back to start
        backBtn.addEventListener('click', () => {
            showScreen('startScreen');
        });

        // Helper: Show screen
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Helper: Shuffle array
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialize
        updateCounts();
    </script>
</body>
</html>
