<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Vokabeltrainer Unit 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .unit-selector {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .unit-selector h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f5f5f7;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-item:active {
            background: #e8e8ed;
        }

        .checkbox-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            cursor: pointer;
        }

        .checkbox-item label {
            flex: 1;
            cursor: pointer;
            font-size: 16px;
        }

        .count {
            font-size: 14px;
            color: #86868b;
        }

        .slider-group {
            margin-top: 20px;
        }

        .slider-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .slider-value {
            display: inline-block;
            margin-left: 8px;
            color: #0071e3;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #d1d1d6;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #0071e3;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #0071e3;
            cursor: pointer;
            border: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }

        .btn:active {
            background: #0077ed;
        }

        .btn:disabled {
            background: #d1d1d6;
            cursor: not-allowed;
        }

        .quiz-card {
            background: white;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .progress {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 20px;
        }

        .question {
            font-size: 24px;
            font-weight: 600;
            margin: 30px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .direction {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border: 2px solid #d1d1d6;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #0071e3;
        }

        .feedback {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
        }

        .correct-answer {
            margin-top: 8px;
            font-size: 14px;
            color: #424245;
        }

        .results-card {
            background: white;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .score {
            font-size: 48px;
            font-weight: 700;
            color: #0071e3;
            margin: 20px 0;
        }

        .score-label {
            font-size: 16px;
            color: #86868b;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .stat-item {
            background: #f5f5f7;
            padding: 20px;
            border-radius: 12px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .stat-label {
            font-size: 14px;
            color: #86868b;
            margin-top: 5px;
        }

        .btn-secondary {
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .btn-secondary:active {
            background: #e8e8ed;
        }

        @media (max-width: 390px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .question {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>Vokabeltrainer</h1>
            
            <div class="unit-selector">
                <h2>Wähle Units aus:</h2>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="unitA" checked>
                        <label for="unitA">Unit 2 Part A</label>
                        <span class="count" id="countA">0</span>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="unitB" checked>
                        <label for="unitB">Unit 2 Part B</label>
                        <span class="count" id="countB">0</span>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="unitC" checked>
                        <label for="unitC">Unit 2 Part C</label>
                        <span class="count" id="countC">0</span>
                    </div>
                </div>

                <div class="slider-group">
                    <label>
                        Anzahl Vokabeln: 
                        <span class="slider-value" id="sliderValue">15</span>
                    </label>
                    <input type="range" id="vocabCount" min="10" max="20" value="15">
                </div>
            </div>

            <button class="btn" id="startBtn">Lernen starten</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-card">
                <div class="progress">
                    Frage <span id="currentQ">1</span> von <span id="totalQ">15</span>
                </div>
                
                <div class="direction" id="direction">Übersetze ins Deutsche</div>
                
                <div class="question" id="question">Loading...</div>
                
                <input type="text" id="answer" placeholder="Deine Antwort..." autocomplete="off" autocapitalize="off">
                
                <div id="feedback"></div>
                
                <button class="btn" id="submitBtn">Prüfen</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <h1>Auswertung</h1>
            
            <div class="results-card">
                <div class="score" id="score">0</div>
                <div class="score-label">Punkte erreicht</div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="correctCount">0</div>
                        <div class="stat-label">Richtig</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="incorrectCount">0</div>
                        <div class="stat-label">Falsch</div>
                    </div>
                </div>
                
                <button class="btn" id="newRoundBtn">Neue Runde</button>
                <button class="btn btn-secondary" id="backBtn">Zurück zur Auswahl</button>
            </div>
        </div>
    </div>

    <script>
        // Vocabulary Database
        const vocabulary = {
            A: [
                {en: "novel", de: "Roman"},
                {en: "I reckon", de: "Ich schätze"},
                {en: "promise", de: "Versprechen"},
                {en: "salty", de: "salzig"},

                {en: "subject", de: "Thema"},
                {en: "politics", de: "Politik"},
                {en: "sensitive", de: "empfindlich"},
                {en: "issue", de: "Thema"},
                {en: "once", de: "einmal"},
                {en: "photographer", de: "Fotograf"},
                {en: "setting", de: "Schauplatz"},
                {en: "series", de: "Serie"}
            ],
            B: [
                {en: "waste", de: "Verschwendung"},
                {en: "tree trunk", de: "Baumstamm"},
                {en: "chin", de: "Kinn"},
                {en: "tear", de: "reißen"},
                {en: "key", de: "Taste"},
                {en: "shake", de: "schütteln"},
                {en: "first aid", de: "Erste Hilfe"},
                {en: "breathe", de: "atmen"},
                {en: "skin", de: "Haut"},
                {en: "cheek", de: "Wange"},
                {en: "pulse", de: "Puls"},
                {en: "brain", de: "Gehirn"},
                {en: "oxygen", de: "Sauerstoff"},
                {en: "distant", de: "entfernt"},
                {en: "sink", de: "sinken"},
                {en: "intelligent", de: "intelligent"},
                {en: "occasionally", de: "gelegentlich"},
                {en: "dreamy", de: "verträumt"},
                {en: "immigrant", de: "Einwanderer"},
                {en: "university", de: "Universität"},
                {en: "soap", de: "Seife"},
                {en: "deodorant", de: "Deodorant"},
                {en: "toothbrush", de: "Zahnbürste"},
                {en: "toothpaste", de: "Zahnpasta"},
                {en: "fridge", de: "Kühlschrank"},
                {en: "can", de: "Dose"},
                {en: "pretty", de: "ziemlich"},
                {en: "anyway", de: "trotzdem"},
                {en: "familiar", de: "vertraut"},
                {en: "awkward", de: "peinlich"},
                {en: "next door", de: "nebenan"},
                {en: "muscle", de: "Muskel"},
                {en: "hand", de: "Uhrzeiger"},
                {en: "mean to do", de: "die Absicht haben"},
                {en: "because of", de: "wegen"},
                {en: "serious", de: "ernst"}
            ],
            C: [
                {en: "request", de: "Bitte"},
                {en: "informal", de: "informell"},
                {en: "be attracted to", de: "sich zu jm. hingezogen fühlen"},
                {en: "be seeing", de: "mit jm. zusammen sein"},
                {en: "fall in love", de: "sich verlieben"},
                {en: "date", de: "mit jm. gehen"},
                {en: "break up", de: "Schluss machen"},
                {en: "get to know", de: "kennenlernen"},
                {en: "annoyed", de: "verärgert"},
                {en: "confused", de: "verwirrt"},
                {en: "cross", de: "böse"},
                {en: "frightened", de: "verängstigt"},
                {en: "hopeful", de: "zuversichtlich"},
                {en: "pessimistic", de: "pessimistisch"},
                {en: "pleased", de: "erfreut"},
                {en: "furious", de: "wütend"},
                {en: "heartbroken", de: "todunglücklich"},
                {en: "terrified", de: "entsetzt"},
                {en: "thrilled", de: "begeistert"},
                {en: "absolutely", de: "völlig"},
                {en: "ex", de: "Ex"},
                {en: "male", de: "männlich"},
                {en: "female", de: "weiblich"},
                {en: "acquaintance", de: "Bekannte(r)"},
                {en: "enter", de: "etwas eingeben"},
                {en: "password", de: "Passwort"},
                {en: "update", de: "aktualisieren"},
                {en: "status", de: "Status"},
                {en: "account", de: "Account"},
                {en: "murder", de: "Mord"},
                {en: "declare", de: "erklären"},
                {en: "husband", de: "Ehemann"},
                {en: "wife", de: "Ehefrau"},
                {en: "ought to", de: "du solltest aufhören"},
                {en: "diet", de: "Ernährung"},
                {en: "protein", de: "Protein"},
                {en: "healthy", de: "gesund"},
                {en: "be supposed to", de: "etwas tun sollen"},
                {en: "pasta", de: "Nudeln"},
                {en: "cultural", de: "kulturell"},
                {en: "communication", de: "Kommunikation"},
                {en: "statistics", de: "Statistik"},
                {en: "bar chart", de: "Balkendiagramm"},
                {en: "pie chart", de: "Tortendiagramm"},
                {en: "chart", de: "Tabelle"},
                {en: "average", de: "durchschnittlich"},
                {en: "length", de: "Länge"},
                {en: "useful", de: "nützlich"},
                {en: "percentage", de: "Prozentsatz"},
                {en: "chore", de: "Pflicht"},
                {en: "realize", de: "etwas erkennen"},
                {en: "amount", de: "Betrag"},
                {en: "insist", de: "auf etwas bestehen"},
                {en: "value", de: "Wert"},
                {en: "tidy", de: "ordentlich"},
                {en: "cash", de: "Bargeld"},
                {en: "simply", de: "einfach"},
                {en: "run out of", de: "zu Ende gehen"},
                {en: "encourage", de: "ermutigen"},
                {en: "perhaps", de: "vielleicht"},
                {en: "certain", de: "bestimmt"},
                {en: "habit", de: "Gewohnheit"},
                {en: "agreement", de: "Einigung"},
                {en: "express", de: "ausdrücken"},
                {en: "stress", de: "betonen"},
                {en: "agree to differ", de: "sich darauf einigen dass man verschiedener Ansicht ist"},
                {en: "remind", de: "erinnern"},
                {en: "refugee", de: "Flüchtling"},
                {en: "youth", de: "Jugend"},
                {en: "organization", de: "Organisation"},
                {en: "run", de: "eine Organisation leiten"},
                {en: "publish", de: "veröffentlichen"},
                {en: "friendship", de: "Freundschaft"},
                {en: "fill in a form", de: "ein Formular ausfüllen"},
                {en: "distance", de: "Distanz"},
                {en: "transport", de: "Verkehrsmittel"},
                {en: "face", de: "vor etwas stehen"},
                {en: "fit in", de: "sich einfügen"},
                {en: "act", de: "handeln"},
                {en: "adapt", de: "anpassen"},
                {en: "get used to", de: "sich an etwas gewöhnen"},
                {en: "end up", de: "schließlich etwas tun"},
                {en: "responsibility", de: "Verantwortung"},
                {en: "within", de: "innerhalb"},
                {en: "advisor", de: "Berater"},
                {en: "carer", de: "Betreuer"},
                {en: "be dependent on", de: "von jm. abhängig sein"},
                {en: "get to do", de: "etwas tun können"},
                {en: "not anywhere", de: "nirgendwo"},
                {en: "shop window", de: "Schaufenster"},
                {en: "apron", de: "Schürze"},
                {en: "be in a hurry", de: "es eilig haben"},
                {en: "normally", de: "normalerweise"}
            ]
        };

        // App State
        let currentQuiz = [];
        let currentIndex = 0;
        let score = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let currentQuestion = null;
        let hasAnswered = false;

        // Elements
        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        
        const unitA = document.getElementById('unitA');
        const unitB = document.getElementById('unitB');
        const unitC = document.getElementById('unitC');
        const vocabCountSlider = document.getElementById('vocabCount');
        const sliderValue = document.getElementById('sliderValue');
        const startBtn = document.getElementById('startBtn');
        
        const currentQ = document.getElementById('currentQ');
        const totalQ = document.getElementById('totalQ');
        const direction = document.getElementById('direction');
        const question = document.getElementById('question');
        const answerInput = document.getElementById('answer');
        const feedback = document.getElementById('feedback');
        const submitBtn = document.getElementById('submitBtn');
        
        const scoreDisplay = document.getElementById('score');
        const correctCount = document.getElementById('correctCount');
        const incorrectCount = document.getElementById('incorrectCount');
        const newRoundBtn = document.getElementById('newRoundBtn');
        const backBtn = document.getElementById('backBtn');

        // Update counts
        function updateCounts() {
            document.getElementById('countA').textContent = vocabulary.A.length + ' Vokabeln';
            document.getElementById('countB').textContent = vocabulary.B.length + ' Vokabeln';
            document.getElementById('countC').textContent = vocabulary.C.length + ' Vokabeln';
        }

        // Slider update
        vocabCountSlider.addEventListener('input', (e) => {
            sliderValue.textContent = e.target.value;
        });

        // Start quiz
        startBtn.addEventListener('click', () => {
            const selectedUnits = [];
            if (unitA.checked) selectedUnits.push(...vocabulary.A);
            if (unitB.checked) selectedUnits.push(...vocabulary.B);
            if (unitC.checked) selectedUnits.push(...vocabulary.C);

            if (selectedUnits.length === 0) {
                alert('Bitte wähle mindestens eine Unit aus!');
                return;
            }

            const count = parseInt(vocabCountSlider.value);
            currentQuiz = shuffleArray(selectedUnits).slice(0, Math.min(count, selectedUnits.length));
            
            currentIndex = 0;
            score = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            
            totalQ.textContent = currentQuiz.length;
            
            showScreen('quizScreen');
            loadQuestion();
        });

        // Load question
        function loadQuestion() {
            if (currentIndex >= currentQuiz.length) {
                showResults();
                return;
            }

            hasAnswered = false;
            currentQuestion = currentQuiz[currentIndex];
            
            // Random direction
            const isEnglishToGerman = Math.random() < 0.5;
            
            if (isEnglishToGerman) {
                direction.textContent = 'Übersetze ins Deutsche';
                question.textContent = currentQuestion.en;
                currentQuestion.correctAnswer = currentQuestion.de;
                currentQuestion.direction = 'de';
            } else {
                direction.textContent = 'Übersetze ins Englische';
                question.textContent = currentQuestion.de;
                currentQuestion.correctAnswer = currentQuestion.en;
                currentQuestion.direction = 'en';
            }

            currentQ.textContent = currentIndex + 1;
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.focus();
            feedback.innerHTML = '';
            submitBtn.textContent = 'Prüfen';
        }

        // Submit answer
        submitBtn.addEventListener('click', () => {
            if (!hasAnswered) {
                checkAnswer();
            } else {
                currentIndex++;
                loadQuestion();
            }
        });

        // Enter key support
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });

        // Check answer
        function checkAnswer() {
            const userAnswer = answerInput.value.trim().toLowerCase();
            const correctAnswer = currentQuestion.correctAnswer.toLowerCase();
            
            // Normalize answers (remove special chars, extra spaces)
            const normalizeAnswer = (str) => str.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, '').replace(/\s+/g, ' ').trim();
            
            const normalizedUser = normalizeAnswer(userAnswer);
            const normalizedCorrect = normalizeAnswer(correctAnswer);
            
            const isCorrect = normalizedUser === normalizedCorrect;
            
            hasAnswered = true;
            answerInput.disabled = true;

            if (isCorrect) {
                score++;
                correctAnswers++;
                feedback.className = 'feedback correct';
                feedback.innerHTML = '✓ Richtig!';
            } else {
                incorrectAnswers++;
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `✗ Falsch<div class="correct-answer">Richtige Antwort: ${currentQuestion.correctAnswer}</div>`;
            }

            submitBtn.textContent = 'Weiter';
        }

        // Show results
        function showResults() {
            scoreDisplay.textContent = score;
            correctCount.textContent = correctAnswers;
            incorrectCount.textContent = incorrectAnswers;
            showScreen('resultsScreen');
        }

        // New round
        newRoundBtn.addEventListener('click', () => {
            startBtn.click();
        });

        // Back to start
        backBtn.addEventListener('click', () => {
            showScreen('startScreen');
        });

        // Helper: Show screen
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Helper: Shuffle array
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialize
        updateCounts();
    </script>
</body>
</html>
